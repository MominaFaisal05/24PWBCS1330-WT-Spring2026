        <title>Task 8 - Navigation Menu Styling</title>
        <link rel="stylesheet" href="../css/main.css">
        <link rel="stylesheet" href="../css/components.css">
        <link rel="stylesheet" href="../css/effects.css">
        
        <style>
.navbar{
background:#333;
overflow:hidden;
}
.navbar a{
float:left;
color:white;
text-align:center;
padding:14px 20px;
text-decoration:none;
transition:0.3s;
}
.navbar a:hover{
background:#575757;
}
.active{
background:#007bff;
}
.dropdown{
float:left;
overflow:hidden;
}
.dropdown .dropbtn{
background:#333;
color:white;
padding:14px 20px;
border:none;
cursor:pointer;
}
.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:160px;
box-shadow:0 0 10px gray;
}
.dropdown-content a{
color:black;
padding:10px;
display:block;
text-decoration:none;
}
.dropdown-content a:hover{
background:#eee;
}
.dropdown:hover .dropdown-content{
display:block;
}
.vertical-menu{
width:200px;
margin-top:30px;
}
.vertical-menu a{
display:block;
padding:10px;
background:#f4f4f4;
border-bottom:1px solid #ddd;
text-decoration:none;
color:black;
transition:0.3s;
}
.vertical-menu a:hover{
background:#ddd;
}
</style>
</head>
