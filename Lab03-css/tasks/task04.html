        <title>Image Gallery</title>
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="stylesheet" href="../styles/effects.css">
        <style>
            .gallery img{
                width: 200px;
                margin: 15px;
                border-radius: 10px;
                box-shadow: 0 0 10px gray;
                transition: 0.3s;
            }
            .gallery img:hover{
                transform:scale(1.1);
                filter:brightness(120%);
            }
            .circle{
                border-radius: 50%;
            }
            .overlay{
                position: relative;
                display: inline-block;
            }
            .overlay span{
                position: absolute;
                bottom:10px;
                left:10px;
                background:black;
                color: white;
                padding: 5px;
            }
        </style>
    </head>
