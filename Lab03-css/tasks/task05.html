        <title>Button Styles</title>
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="stylesheet" href="../styles/components.css">
        <link rel="stylesheet" href="../styles/effects.css">
        <style>
            .btn{
                padding: 12px 25px;
                margin: 10px;
                border: none;
                cursor: pointer;
                transition: 0.3s;
            }
            .primary{
                background: blue;
                color: white;
            }
            .round{
                border-radius: 25px;
            }
            .shadow{
                box-shadow: 2px 2px 10px gray;
            }
            .btn:hover{
                background: black;
                color: white;
            }
            .btn:disabled{
                background: gray;
                cursor: not-allowed;
            }
        </style>
    </head>
