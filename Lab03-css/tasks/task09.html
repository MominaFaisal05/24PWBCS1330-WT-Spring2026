        <title>Transform Gallery</title>
        <link rel="stylesheet" href="../styles/effects.css">
        <style>
            .box{
                width: 120px;
                height: 120px;
                background: blue;
                margin: 20px;
                display: inline-block;
                transition: 0.5s;
            }
            .rotate:hover{transform: rotate(45deg);}
            .scale:hover{transform: scale(1.3);}
            .move:hover{transform: translate(50px);}
            .skew:hover{transform: skew(20deg);}
        </style>
    </head>
