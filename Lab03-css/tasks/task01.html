<!DOCTYPE html>
<html>
    <head>
        <title>CSS Selectors</title>
        <link rel="stylesheet" href="../styles/main.css">
        <style>
            /*Basic Selectors */
            p{color: blue;}
            .highlight{background: yellow;}
            #special{color: red}
            *{font-family: Arial;}
            div{border: 1px solid gray;
            padding: 10px;}

            /* Attribute selectors */
            input[type="text"]{border: 2px solid green;}
            a[target="_blank"]{color:purple;}
            img[alt*="photo"]{border: 3px solid black;}

            /* Combinators */
            div p{color:green;}       
            div > span{color:orange;} 
            h3 + p{font-style:italic;}
            h3 ~ p{background:#eee;}  

            /* Pseudo classes */
            a:hover{color:red;}
            a:active{color:green;}
            input:focus{background:#f0f0f0;}
            li:first-child{color:blue;}
            li:last-child{color:red;}

            /* Pseudo elements */
            p::first-letter{font-size:25px;}
            
        
        </style>
    </head>
