<title>Attribute Selectors</title>
<style>

/* Attribute selector */
input[type]{
border:2px solid blue;
}
/* Attribute value selector */
input[type="text"]{
background-color:lightyellow;
}
/* Contains value */
a[href*="google"]{
color:red;
}
/* Begins with */
a[href^="https"]{
font-weight:bold;
}
/* Ends with */
a[href$=".com"]{
text-decoration:underline;
}
</style>
</head>
