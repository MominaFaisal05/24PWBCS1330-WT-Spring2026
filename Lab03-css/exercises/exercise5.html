<title>Pseudo Classes</title>

<style>
/* Link states */

a:link{
color:blue;
}
a:visited{
color:purple;
}
a:hover{
color:red;
}
a:active{
color:green;
}

/* Form states */
input:focus{
background:lightyellow;
}
input:checked{
outline:2px solid red;
}

/* Structural */
li:first-child{
color:red;
}
li:last-child{
color:blue;
}
li:nth-child(2){
font-weight:bold;
}

</style>
