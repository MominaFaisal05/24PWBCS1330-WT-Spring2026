<title>CSS Combinators</title>
<style>

/* Descendant */
div p{
color:blue;
}
/* Child */
div > h3{
color:red;
}
/* Adjacent sibling */
h2 + p{
background:yellow;
}
/* General sibling */
h2 ~ span{
color:green;
}

</style>
</head>
